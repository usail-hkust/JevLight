[project]
name = "jevlight-decision-heads"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "safetensors==0.8.0",
    "pillow==12.3.0",
    "huggingface-hub==1.31.0",
    "accelerate>=1.10",
    "requests>=2.32",
]

[project.optional-dependencies]
acceleration = ["flash-linear-attention==0.5.2", "einops==0.8.2"]
